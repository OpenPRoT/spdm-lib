[package]
name = "spdm-stack"
version.workspace = true
authors.workspace = true
edition.workspace = true


[dependencies]
spdm-traits = { workspace = true }
spdm-codec = { workspace = true }
spdm-crypto = { workspace = true }
spdm-errors = { workspace = true }
spdm-error = { workspace = true }
bitfield-struct = { workspace = true }
zerocopy = { workspace = true }
spdm-console = { workspace = true, optional = true }
spdm-transport-sys = { workspace = true, optional = true }

[dev-dependencies]
futures.workspace = true

[features]
default = []
set-certificate = ["spdm-traits/set-certificate"]
debug-trace = [
  "spdm-console",
  "spdm-transport-sys",
]
